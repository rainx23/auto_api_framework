# 公共参数
case_common:
  allureEpic: 开发平台接口
  allureFeature: 查询模块
  allureStory: 查询

query_college_01:
    host: ${{host()}}
    url: /home/daxue/ajax
    method: POST
    detail: 真实大学-四川轻化工大学
    headers:
        user-agent: Chrome
        Authorization: $cache{token}
    # 请求的数据，是 params 还是 json、或者 data, file
    requestType: data
    # 是否执行，空或者 true 都会执行
    is_run:
    data:
        type: "name"
        keyword: "四川轻化工大学"
    # 是否有依赖业务，为空或者false则表示没有
    dependence_case:
    assert:
        # 断言接口状态码
        errorStatus:
            jsonpath: $.status
            type: ==
            value: 1
            AssertType:
        # 断言接口返回的username
        errorInfo:
            jsonpath: $.info
            type: ==
            value: '查询成功！'
            AssertType:

