# 公共参数
case_common:
  allureEpic: 商城平台接口
  allureFeature: 用户管理
  allureStory: 创建用户

create_user_01:
    host: ${{host()}}
    url: /api/private/v1/users
    method: POST
    detail: 创建用户成功（必填参数）
    headers:
        Content-Type: application/json
        Authorization: $cache{token}
    # 请求的数据，是 params 还是 json、或者 data, file
    requestType: json
    data:
        username: "${{get_username()}}"
        password: "admin123"
    assert:
        # 断言接口状态码
        errorStatus:
            jsonpath: $.meta.status
            type: ==
            value: 200
            AssertType:
        # 断言接口返回的msg
        errorInfo:
            jsonpath: $.meta.msg
            type: ==
            value: "创建成功"
            AssertType:
            
