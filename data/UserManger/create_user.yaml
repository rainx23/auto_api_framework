# 公共参数
case_common:
  allureEpic: 商城平台接口
  allureFeature: 用户管理
  allureStory: 创建用户

create_user_01:
    host: ${{host()}}
    url: /api/private/v1/users
    method: POST
    detail: 创建用户成功（必填参数）
    headers:
        Content-Type: application/json
        Authorization: $cache{token}
    # 请求的数据，是 params 还是 json、或者 data, file
    requestType: json
    # 是否执行，空或者 true 都会执行
    is_run: 
    # 是否有依赖业务，为空或者false则表示没有
    data:
      username: "${{get_username()}}"
      password: "${{get_password()}}"
    dependence_case:
    assert:
        # 断言接口状态码
        errorStatus:
            jsonpath: $.meta.status
            type: ==
            value: 201
            AssertType:
        # 断言接口返回的msg
        errorInfo:
            jsonpath: $.meta.msg
            type: ==
            value: "创建成功"
            AssertType:
            
