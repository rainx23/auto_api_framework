# 公共参数
case_common:
  allureEpic: 商城平台接口
  allureFeature: 用户管理
  allureStory: 修改用户信息

update_user_info_01:
    host: ${{host()}}
    url: /api/private/v1/users/$cache{update_user_info_01_id}
    method: PUT
    detail: 修改用户信息成功
    headers:
        Authorization: $cache{token}
    # 请求的数据，是 params 还是 json、或者 data, file
    requestType: None
    # 是否执行，空或者 true 都会执行
    is_run: true
    data: 
    # 是否有依赖业务，为空或者false则表示没有
    dependence_case: True
    # 依赖的数据
    dependence_case_data:
      - case_id: create_user_03
        dependent_data:
          - dependent_type: response
            jsonpath: $.data.id
            set_cache: update_user_info_01_id
    assert:
        # 断言接口状态码
        errorStatus:
            jsonpath: $.meta.status
            type: ==
            value: 200
            AssertType:
        # 断言接口返回的msg
        errorInfo:
            jsonpath: $.meta.msg
            type: ==
            value: "更新成功"
            AssertType:

update_user_info_02:
    host: ${{host()}}
    url: /api/private/v1/users/${{get_unixtime()}}
    method: PUT
    detail: 修改用户信息失败（不存在用户）
    headers:
        Authorization: $cache{token}
    # 请求的数据，是 params 还是 json、或者 data, file
    requestType: None
    # 是否执行，空或者 true 都会执行
    is_run: true
    data:
    # 是否有依赖业务，为空或者false则表示没有
    dependence_case:
    # 依赖的数据
    dependence_case_data:
    assert:
        # 断言接口状态码
        errorStatus:
            jsonpath: $.meta.status
            type: ==
            value: 400
            AssertType:
        # 断言接口返回的msg
        errorInfo:
            jsonpath: $.meta.msg
            type: ==
            value: "更新失败"
            AssertType: