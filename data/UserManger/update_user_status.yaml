# 公共参数
case_common:
  allureEpic: 商城平台接口
  allureFeature: 用户管理
  allureStory: 修改用户状态

update_user_status_01:
    host: ${{host()}}
    url: /api/private/v1/users/$cache{id}/state/true
    method: PUT
    detail: 修改用户状态成功
    headers:
        Authorization: $cache{token}
    # 请求的数据，是 params 还是 json、或者 data, file
    requestType: None
    # 是否执行，空或者 true 都会执行
    is_run: true
    data: 
    # 是否有依赖业务，为空或者false则表示没有
    dependence_case: True
    # 依赖的数据
    dependence_case_data:
      - case_id: create_user_03
        dependent_data:
          - dependent_type: response
            jsonpath: $.data.id
            set_cache: id
    # 依赖的数据
    assert:
        # 断言接口返回state
        errorInfo_1:
            jsonpath: $.data.mg_state
            type: ==
            value: 1
            AssertType:
        # 断言接口返回的msg
        errorInfo_2:
            jsonpath: $.meta.msg
            type: ==
            value: "设置状态成功"
            AssertType:
        # 断言接口状态码
        errorStatus:
            jsonpath: $.meta.status
            type: ==
            value: 200
            AssertType:

