# 公共参数
case_common:
  allureEpic: 商城平台接口
  allureFeature: 用户管理
  allureStory: 获取用户数据列表

get_user_data_list_01:
    host: ${{host()}}
    url: /api/private/v1/users
    method: GET
    detail: 获取用户数据列表成功
    headers:
        Authorization: $cache{token}
    # 请求的数据，是 params 还是 json、或者 data, file
    requestType: params
    # 是否执行，空或者 true 都会执行
    is_run: 
    data:
        pagenum: 1
        pagesize: 20
    assert:
        # 断言接口状态码
        errorStatus:
            jsonpath: $.meta.status
            type: ==
            value: 200
            AssertType:
        # 断言接口返回的msg
        errorInfo:
            jsonpath: $.meta.msg
            type: ==
            value: "获取管理员列表成功"
            AssertType: