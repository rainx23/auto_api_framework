# 公共参数
case_common:
  allureEpic: 商城平台接口
  allureFeature: 用户管理
  allureStory: 用户登录

login_user_01:
    host: ${{host()}}
    url: /api/private/v1/login
    method: POST
    detail: 用户登录成功（已创建用户）
    headers:
        Authorization: $cache{token}
    # 请求的数据，是 params 还是 json、或者 data, file
    requestType: json
    # 是否执行，空或者 true 都会执行
    is_run:
    data:
      username: "admin"
      password: "123456"
    # 是否有依赖业务，为空或者false则表示没有
    dependence_case:
    # 依赖的数据
    assert:
        # 断言接口状态码
        errorStatus:
            jsonpath: $.meta.status
            type: ==
            value: 200
            AssertType:
        # 断言接口返回的msg
        errorInfo:
            jsonpath: $.meta.msg
            type: ==
            value: "登录成功"
            AssertType:
    sql:

