# 公共参数
case_common:
  allureEpic: 商城平台接口
  allureFeature: 商品管理
  allureStory: 编辑商品

edit_product_01:
    host: ${{host()}}
    url: /api/private/v1/goods/$cache{goods_id}
    method: PUT
    detail: 编辑商品成功（全部参数）
    headers:
        Authorization: $cache{token}
    # 请求的数据，是 params 还是 json、或者 data, file
    requestType: json
    # 是否执行，空或者 true 都会执行
    is_run: true
    data:
        goods_name: "${{get_char()}}手机壳"
        goods_cat: "1,2,3"
        goods_price: "59.9"
        goods_number: "300"
        goods_weight: "200"
        goods_introduce: "test手机壳"
        pics: ""
        attr: "手机壳"
    # 是否有依赖业务，为空或者false则表示没有
    dependence_case: True
    # 依赖的数据
    dependence_case_data:
      - case_id: add_product_01
        dependent_data:
          - dependent_type: response
            jsonpath: $.data.goods_id
            set_cache: goods_id
    assert:
        # 断言接口状态码
        errorStatus:
            jsonpath: $.meta.status
            type: ==
            value: 200
            AssertType:
        # 断言接口返回的msg
        errorInfo:
            jsonpath: $.meta.msg
            type: ==
            value: "创建商品成功"
            AssertType:
    sql:

