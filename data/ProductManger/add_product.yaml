# 公共参数
case_common:
  allureEpic: 商城平台接口
  allureFeature: 商品管理
  allureStory: 添加商品

add_product_01:
    host: ${{host()}}
    url: /api/private/v1/goods
    method: POST
    detail: 添加商品成功
    headers:
        Authorization: $cache{token}
    # 请求的数据，是 params 还是 json、或者 data, file, none
    requestType: json
    # 是否执行，空或者 true 都会执行
    is_run: true
    data:
        goods_name: "手机壳${{get_char()}}"
        goods_cat: "1,2,3"
        goods_price: "19.9"
        goods_number: "200"
        goods_weight: "100"
        goods_introduce: "手机壳"
        pics: ""
        attr: "手机壳"
    # 是否有依赖业务，为空或者false则表示没有
    dependence_case: 
    # 依赖的数据
    dependence_case_data:
    assert:
        # 断言接口状态码
        errorStatus:
            jsonpath: $.meta.status
            type: ==
            value: 201
            AssertType:
        # 断言接口返回的msg
        errorInfo:
            jsonpath: $.meta.msg
            type: ==
            value: "创建商品成功"
            AssertType:
    sql:

