# 公共参数
case_common:
  allureEpic: 商城平台接口
  allureFeature: 角色管理
  allureStory: 删除角色指定权限

role_list_01:
    host: ${{host()}}
    url: /api/private/v1/roles/{roleId}/rights/{rightId}
    method: DELETE
    detail: 删除角色指定权限成功
    headers:
        Authorization: $cache{token}
    # 请求的数据，是 params 还是 json、或者 data, file
    requestType: json
    # 是否执行，空或者 true 都会执行
    is_run: true
    data:
      roleName: ${{get_position()}}
    # 是否有依赖业务，为空或者false则表示没有
    dependence_case: True
    # 依赖的数据
    dependence_case_data:
    assert:
        # 断言接口状态码
        errorStatus:
            jsonpath: $.meta.status
            type: ==
            value: 201
            AssertType:
        # 断言接口返回的msg
        errorInfo:
            jsonpath: $.meta.msg
            type: ==
            value: "创建成功"
            AssertType:
    sql:

