# 公共参数
case_common:
  allureEpic: 商城平台接口
  allureFeature: 角色管理
  allureStory: 删除角色指定权限

delete_role_empower_01:
    host: ${{host()}}
    url: /api/private/v1/roles/$cache{roleId}/rights/110
    method: DELETE
    detail: 删除角色指定权限成功
    headers:
        Authorization: $cache{token}
    # 请求的数据，是 params 还是 json、或者 data, file
    requestType: none
    # 是否执行，空或者 true 都会执行
    is_run: true
    data:
    # 是否有依赖业务，为空或者false则表示没有
    dependence_case: True
    # 依赖的数据
    dependence_case_data:
      - case_id: role_list_02
        dependent_data:
          - dependent_type: response
            jsonpath: $.data.roleId
            set_cache: roleId
    assert:
        # 断言接口状态码
        errorStatus:
            jsonpath: $.meta.status
            type: ==
            value: 200
            AssertType:
        # 断言接口返回的msg
        errorInfo:
            jsonpath: $.meta.msg
            type: ==
            value: "取消权限成功"
            AssertType:
    sql:

